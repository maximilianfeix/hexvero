name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest && npm --version
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify the tag matches the package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for w in packages/core packages/mcp packages/server packages/cli; do
            V=$(node -p "require('./$w/package.json').version")
            [ "$V" = "$TAG" ] || { echo "$w is $V but tag is $TAG"; exit 1; }
          done
      - name: Pack
        run: |
          mkdir -p release
          for w in packages/core packages/mcp packages/server packages/cli; do npm pack -w ./$w --pack-destination release >/dev/null; done
          ls -la release
      - name: Release notes
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > release/NOTES.md
      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release/NOTES.md
          files: release/*.tgz
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # With a trusted publisher configured on npmjs.com this needs no token (OIDC + provenance).
          # If NPM_TOKEN is set as a repository secret it is used instead.
          if [ -n "$NODE_AUTH_TOKEN" ]; then echo "publishing with NPM_TOKEN"; else echo "publishing with trusted publishing (OIDC)"; fi
          for w in packages/core packages/mcp packages/server packages/cli; do
            V=$(node -p "require('./$w/package.json').version")
            N=$(node -p "require('./$w/package.json').name")
            if npm view "$N@$V" version >/dev/null 2>&1; then echo "$N@$V already on npm, skipping"; continue; fi
            npm publish -w ./$w --access public --provenance
          done
