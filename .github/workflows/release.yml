name: Release

# A release is a tag vX.Y.Z on main. Order of events:
#   verify          checks, build, end-to-end flows, the site demo and corpus gates, pack, install
#                   the tarballs and exercise them, validate version and source (no credentials)
#   platforms       typecheck and tests on Windows and macOS (no credentials)
#   publish         draft GitHub release -> npm publish of exactly those tarballs with provenance
#                   -> read back from the registry until the integrity matches
#   registry-smoke  install from the registry and exercise it (no credentials)
#   finalize        only now the GitHub release becomes public
# Running the workflow by hand performs the verify job only (a rehearsal; packages whose version
# is already on npm are reported as SKIPPED). Publishing exists only on the tag path.
# After a failure use "Re-run failed jobs": it reuses the tarballs already published from.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify, build and smoke-test the packages
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # No dependency cache: what is released is built from a fresh install of the lockfile.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Pin npm so the packed tarballs are reproducible across runs
        run: npm install -g npm@11.6.2 && npm --version
      - run: npm ci
      - run: npm run check
      - name: Electron, native, comparison and MCP-over-stdio flows (builds the packages)
        run: npm run e2e
      - name: The committed examples are what the generator produces
        run: git diff --exit-code -- examples
      - name: The website's example comparison is what the current build produces
        run: node scripts/build-site-demo.mjs --check
      - name: The corpus inputs rebuild to the committed bytes
        run: node corpus/build.mjs --check
      - name: No corpus result is worse than the committed one
        run: node corpus/gate.mjs
      - name: Version is consistent (and matches the tag)
        id: version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then node scripts/release-verify.mjs "${GITHUB_REF_NAME}"; else node scripts/release-verify.mjs; fi
          echo "version=$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: The tagged commit is on main
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || { echo "tag ${GITHUB_REF_NAME} does not point to a commit on main"; exit 1; }
      - name: Pack, install the tarballs in a clean project and exercise CLI, MCP and UI
        run: node scripts/smoke-tarballs.mjs --out release
      - name: Publish dry run (no credentials)
        # On a tag, a version that already exists with other content stops the release here.
        # A manual rehearsal on an unreleased tree reports it and continues.
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then node scripts/publish-tarballs.mjs release --dry-run; else node scripts/publish-tarballs.mjs release --dry-run --allow-existing; fi
      - name: Release notes
        run: node scripts/release-notes.mjs "v${{ steps.version.outputs.version }}" > release/NOTES.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  platforms:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  publish:
    name: Publish to npm
    needs: [verify, platforms]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the draft GitHub release
      id-token: write # npm trusted publishing and provenance
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use a pinned npm that supports trusted publishing
        # Pinned on purpose: this job holds publish credentials, so it must not run whatever npm is latest.
        run: npm install -g npm@11.6.2 && npm --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.verify.outputs.version }}
          path: release
      - name: Tarballs are the ones the verify job tested
        run: |
          node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync } = require("node:fs");
            const m = JSON.parse(readFileSync("release/manifest.json", "utf8"));
            if (m.version !== process.env.VERSION) throw new Error("manifest version mismatch");
            for (const t of m.tarballs) {
              const sum = createHash("sha256").update(readFileSync("release/" + t.file)).digest("hex");
              if (sum !== t.sha256) throw new Error(t.file + " changed after verification");
              console.log("ok", t.file, sum);
            }'
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} exists; refreshing notes and assets"
            gh release edit "${GITHUB_REF_NAME}" --notes-file release/NOTES.md
            gh release upload "${GITHUB_REF_NAME}" release/*.tgz --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/*.tgz --draft --verify-tag --title "${GITHUB_REF_NAME}" --notes-file release/NOTES.md
          fi
      - name: Publish to npm and verify the registry
        env:
          # npm tries trusted publishing (OIDC from this workflow) first; NPM_TOKEN is the fallback
          # when no trusted publisher is configured on npmjs.com.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "npm $(npm --version); NPM_TOKEN fallback present: $([ -n "${NODE_AUTH_TOKEN}" ] && echo yes || echo no)"
          node scripts/publish-tarballs.mjs release

  registry-smoke:
    name: Install from the registry and exercise the release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    # No credentials here: this job installs and runs third-party dependencies.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.verify.outputs.version }}
          path: release
      - name: Published packages are the released tarballs and work when installed
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/smoke-tarballs.mjs --registry --out release; then exit 0; fi
            echo "registry install failed (attempt ${attempt}); waiting for propagation"; sleep 20
          done
          exit 1

  finalize:
    name: Make the GitHub release public
    needs: [verify, registry-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          case "${VERSION}" in
            *-*) gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --prerelease ;;
            *) gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest ;;
          esac
