name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the whole pipeline including npm publish --dry-run, without releasing"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Use a pinned npm that supports trusted publishing
        # Pinned on purpose: this job holds publish credentials, so it must not run whatever npm is latest.
        run: npm install -g npm@11.6.2 && npm --version
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify the tag matches the package versions
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for w in packages/core packages/mcp packages/server packages/cli; do
            V=$(node -p "require('./$w/package.json').version")
            [ "$V" = "$TAG" ] || { echo "$w is $V but tag is $TAG"; exit 1; }
          done
      - name: Pack
        run: |
          mkdir -p release
          for w in packages/core packages/mcp packages/server packages/cli; do npm pack -w ./$w --pack-destination release >/dev/null; done
          ls -la release
      - name: Release notes
        if: github.event_name == 'push'
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > release/NOTES.md
      - name: GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          body_path: release/NOTES.md
          files: release/*.tgz
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          # npm tries trusted publishing (OIDC from this workflow) first and uses that token when a
          # trusted publisher is configured on npmjs.com; NPM_TOKEN is only the fallback when none is.
          echo "npm $(npm --version); NPM_TOKEN secret present: $([ -n "$NODE_AUTH_TOKEN" ] && echo yes || echo no); dry run: ${DRY_RUN:-false}"
          EXTRA=""; [ "${DRY_RUN}" = "true" ] && EXTRA="--dry-run"
          for w in packages/core packages/mcp packages/server packages/cli; do
            V=$(node -p "require('./$w/package.json').version")
            N=$(node -p "require('./$w/package.json').name")
            if [ -z "$EXTRA" ] && npm view "$N@$V" version >/dev/null 2>&1; then echo "$N@$V already on npm, skipping"; continue; fi
            npm publish -w ./$w --access public --provenance $EXTRA
          done
