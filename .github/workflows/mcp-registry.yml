name: MCP registry

# Publishes server.json to the official MCP registry after a release. GitHub OIDC proves that this
# repository owns the io.github.maximilianfeix namespace, so no token or secret is involved.
# The Release workflow makes the GitHub release public with its own token, and events caused by
# that token start no other workflow; so this one follows the Release workflow itself.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # A Release run started by hand is a rehearsal that publishes nothing: follow only tag pushes.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # the released commit, not whatever main is by now
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Install mcp-publisher 1.8.1 (checksum verified)
        run: |
          curl -sSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: server.json names the published npm version
        run: |
          version=$(node -p "require('./server.json').version")
          test "$(npm view "hexvero@${version}" mcpName)" = "$(node -p "require('./server.json').name")"
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
