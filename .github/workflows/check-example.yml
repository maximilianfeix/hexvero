# An example of `hexvero check` in CI through this repository's reusable action (action.yml), run
# on the two synthetic example builds of this repository (examples/notesdesk-1.4.0.asar → 1.5.0.asar). 1.5.0 adds an update host and a preload member,
# so the check is expected to fail with exit 3; the job fails if it ever says anything else.
# For your own repository see docs/ci.md.
name: Release policy example

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: hexvero check on the example builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build hexvero
        run: npm run build -w @hexvero/core -w @hexvero/mcp -w @hexvero/server -w hexvero
      - name: Build the example builds and confirm they are the committed ones
        run: node scripts/build-examples.mjs && git diff --exit-code -- examples
      - name: Test the reusable action's script
        run: node --test .github/actions/check/run.test.mjs
      # The reusable action of this repository (action.yml), run with this commit's build instead of
      # the published version from npm. In your own workflow leave HEXVERO_ACTION_CLI out and pin
      # the action by commit SHA; see docs/ci.md.
      - name: Check the release against the example policy
        id: check
        uses: ./
        # The example is built to violate the policy; the next step checks it did.
        continue-on-error: true
        env:
          HEXVERO_ACTION_CLI: packages/cli/bin/hexvero.js
        with:
          before: examples/notesdesk-1.4.0.asar
          after: examples/notesdesk-1.5.0.asar
          policy: examples/policy.json
          sarif: hexvero.sarif
      # In your own workflow the action's step fails the job on a violated policy (3) or an
      # undecidable one (4). The example is built to violate it, so anything but 3 is a bug.
      - name: The check exited 3 and wrote its SARIF file
        env:
          EXIT_CODE: ${{ steps.check.outputs.exit-code }}
          SARIF: ${{ steps.check.outputs.sarif }}
        run: |
          echo "exit-code=$EXIT_CODE sarif=$SARIF"
          test "$EXIT_CODE" = 3
          test -s "$SARIF"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hexvero-sarif
          path: hexvero.sarif
          retention-days: 7

  upload:
    name: Upload SARIF to code scanning
    needs: check
    # Only where the token may write security events: never for pull requests from forks, and
    # only when the repository opted in, so the example does not add alerts to a security tab by
    # default. Set the repository variable HEXVERO_EXAMPLE_SARIF_UPLOAD=true to enable it.
    if: >-
      vars.HEXVERO_EXAMPLE_SARIF_UPLOAD == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hexvero-sarif
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: hexvero.sarif
          category: hexvero-check-example
