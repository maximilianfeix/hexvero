version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        patterns: ["vite*", "@vitejs/*", "vitest", "oxlint", "oxfmt", "typescript", "@types/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
