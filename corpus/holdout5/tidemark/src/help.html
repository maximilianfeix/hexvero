<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Markdown help</title>
  </head>
  <body>
    <h1>Writing entries</h1>
    <p>Each entry is one line of Markdown. Start with a verb in the past tense.</p>
    <ul>
      <li><code>**bold**</code> for breaking changes</li>
      <li><code>`code`</code> for names of options and commands</li>
      <li><code>[text](url)</code> for links; links are checked before publishing</li>
    </ul>
  </body>
</html>
