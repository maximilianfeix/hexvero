<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
<title id="title">hexvero: know what changed inside your Electron release.</title>
<desc id="desc">Two builds of an example Electron app compared: a new preload member with its preload and handler lines, a new IPC channel, a channel reported as unknown rather than removed, a window setting that changed, a new host, and hexvero check failing with exit 3. Shortened from real output.</desc>
<defs><clipPath id="frame"><rect width="1280" height="360" rx="24"/></clipPath><style>text {font-family:"IBM Plex Sans", "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;fill:#E8E6E1} .wordmark {font-size:34px;font-weight:600;letter-spacing:-1.2px} .headline {font-size:46px;font-weight:600;letter-spacing:-1.6px} .sub {font-size:20px;fill:#9A9EA7} .mono {font-family:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;font-size:15px;font-variant-ligatures:none} .row {font-size:14px} .small {font-family:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;font-size:13px} .muted {fill:#9A9EA7}</style></defs>
<g clip-path="url(#frame)"><path fill="#1B1D21" d="M0 0H1280V360H0Z"/>
<g transform="translate(40 40)"><g fill="none" stroke="#F2B84B" stroke-linecap="round"><path d="M20 16V48 M44 16V48 M20 30H44" stroke-width="6.5"/><circle cx="28" cy="42" r="2.5" stroke-width="1.5"/><circle cx="36" cy="42" r="3.25" fill="#F2B84B" stroke="none"/></g></g>
<text x="112" y="84" class="wordmark">hexvero</text>
<text x="48" y="160" class="headline">Know what changed inside</text>
<text x="48" y="214" class="headline">your Electron release.</text>
<text x="48" y="256" class="sub">Two builds. File and line on both sides. A CI policy gate.</text>
<rect x="48" y="284" width="232" height="36" rx="8" fill="#23262C" stroke="#31353D"/>
<text x="64" y="308" class="mono"><tspan class="muted">$ </tspan>npx hexvero demo</text>
<rect x="724" y="40" width="508" height="280" rx="16" fill="#23262C" stroke="#31353D"/>
<text x="748" y="72" class="small muted">notesdesk 1.4.0 → 1.5.0</text>
<text x="1208" y="72" class="small muted" text-anchor="end">nothing executed</text>
<path d="M724 88H1232 M724 278H1232" stroke="#31353D"/>
<text x="756" y="128" class="mono row" style="fill:#8FC98A">+</text><text x="776" y="128" class="mono row">notesdesk.checkUpdate</text><text x="1200" y="128" class="mono row muted" text-anchor="end">preload.js:9 → main.js:30</text>
<text x="756" y="162" class="mono row" style="fill:#8FC98A">+</text><text x="776" y="162" class="mono row">update:check</text><text x="1200" y="162" class="mono row muted" text-anchor="end">main.js:30</text>
<rect x="740" y="177" width="476" height="28" rx="5" fill="#3A2F17"/><text x="756" y="196" class="mono row" style="fill:#F2B84B">?</text><text x="776" y="196" class="mono row">shell:open</text><text x="1200" y="196" class="mono row muted" text-anchor="end">unknown, not removed</text>
<text x="756" y="230" class="mono row" style="fill:#9A9EA7">~</text><text x="776" y="230" class="mono row">win  sandbox: false → true</text><text x="1200" y="230" class="mono row muted" text-anchor="end">main.js:15</text>
<text x="756" y="264" class="mono row" style="fill:#8FC98A">+</text><text x="776" y="264" class="mono row">updates.notesdesk.example</text><text x="1200" y="264" class="mono row muted" text-anchor="end">main.js:30</text>
<text x="748" y="305" class="small" style="fill:#E5736F">✗ hexvero check · policy violated · exit 3</text>
